name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  powershell-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
        continue-on-error: true

      - name: Ensure PSScriptAnalyzer is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          $module = Get-Module -ListAvailable -Name PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -Repository PSGallery
              $module = Get-Module -ListAvailable -Name PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
          }

          if (-not $module) {
              throw 'PSScriptAnalyzer could not be installed or discovered.'
          }

          Write-Host "Using PSScriptAnalyzer $($module.Version)"

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.ps1 -File -Recurse
          if (-not $files) {
              throw 'No PowerShell scripts found.'
          }

          Write-Host "Parsing $($files.Count) PowerShell files."

          foreach ($file in $files) {
              Write-Host "Parsing $($file.FullName)"
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  $messages = @($errors | ForEach-Object { "$($_.Message) [$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber)]" })
                  $messageText = $messages -join [Environment]::NewLine
                  throw "Parse errors in $($file.FullName):`n$messageText"
              }
          }

      - name: Run ScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.ps1 -File -Recurse
          $results = @()
          Write-Host "Running ScriptAnalyzer against $($files.Count) PowerShell files."
          foreach ($file in $files) {
              Write-Host "Analyzing $($file.FullName)"
              $results += Invoke-ScriptAnalyzer -Path $file.FullName -Severity Error, Warning
          }

          if ($results.Count -gt 0) {
              $results | Format-Table -AutoSize | Out-String | Write-Host
              throw 'PSScriptAnalyzer reported findings.'
          }
